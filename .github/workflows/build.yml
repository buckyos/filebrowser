name: Build File Browser PIKG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pikg:
    name: Build Linux/amd64 PIKG
    runs-on: ubuntu-latest
    steps:
      - name: Check out File Browser
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out BuckyOS tool
        uses: actions/checkout@v6
        with:
          repository: buckyos/buckyos
          path: .buckyos-source

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.24.0"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install BuckyOS tool runtime dependency
        run: pnpm --dir .buckyos-source/src/apps/sys_test install --frozen-lockfile

      - name: Build and verify PIKG
        run: python3 build_dapp.py
        env:
          BUCKYOS_TOOL_PATH: ${{ github.workspace }}/.buckyos-source/src/tools/buckyos-tool/buckyos

      - name: Read DApp version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('dapp_meta/app.json'))['version'])")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload PIKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: filebrowser-${{ steps.version.outputs.value }}-pikg
          path: dapp_dist/filebrowser-${{ steps.version.outputs.value }}.pikg

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: filebrowser-${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dapp_dist/filebrowser-${{ steps.version.outputs.value }}.pikg
