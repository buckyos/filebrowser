name: Release File Browser PIKG

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filebrowser-pikg-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pikg:
    name: Build and release Linux/amd64 PIKG
    runs-on: ubuntu-latest
    steps:
      - name: Check out File Browser
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read DApp release metadata
        id: release
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('dapp_meta/app.json'))['version'])")
          PIKG_FILE=$(python3 -c "import json; print(json.load(open('dapp_meta/pikg.json'))['pikg_file'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pikg_file=$PIKG_FILE" >> "$GITHUB_OUTPUT"

      - name: Check out BuckyOS tool
        uses: actions/checkout@v6
        with:
          repository: buckyos/buckyos
          path: .buckyos-source

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.24.0"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install BuckyOS tool runtime dependency
        run: pnpm --dir .buckyos-source/src/apps/sys_test install --frozen-lockfile

      - name: Build and verify PIKG
        run: python3 build_pikg.py
        env:
          BUCKYOS_TOOL_PATH: ${{ github.workspace }}/.buckyos-source/src/tools/buckyos-tool/buckyos

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: filebrowser-${{ steps.release.outputs.version }}-pikg
          path: dapp_dist/${{ steps.release.outputs.pikg_file }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: filebrowser-${{ steps.release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dapp_dist/${{ steps.release.outputs.pikg_file }}
